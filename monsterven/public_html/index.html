/* dashboard-header + animation Header */
.dashboard-header {
  grid-area: header;
  background-color: inherit;
  padding: 1.25rem;

  /* Центрирование содержимого */
  display: flex;
  justify-content: center; /* Горизонтальное центрирование */
  align-items: center; /* Вертикальное центрирование */

}

.dashboard-header h1 {
  font-family: 'Courier New', Courier, monospace;
  font-size: 6em; /* Большой размер текста */
  position: relative; /* Для анимации */
  margin: 0; /* Убираем отступы */
  color: transparent;
  -webkit-text-stroke: 2px #000000; /* Обводка текста */
}

.dashboard-header h1::after {
  content: "Fast ∞ Upload";
  position: absolute;
  top: 0;
  left: 0;
  color: #16b1d8; /* Цвет заливки текста */
  animation: animate 8s ease-in-out infinite; /* Анимация */
}

@keyframes animate {
  0%,
  100% {
    clip-path: polygon(
      0% 45%,
      16% 44%,
      33% 50%,
      54% 60%,
      70% 61%,
      84% 59%,
      100% 52%,
      100% 100%,
      0% 100%
    );
  }

  50% {
    clip-path: polygon(
      0% 60%,
      15% 65%,
      34% 66%,
      51% 62%,
      67% 50%,
      84% 45%,
      100% 46%,
      100% 100%,
      0% 100%
    );
  }
}
body::-webkit-scrollbar {
    width: 0.5em;
}
 
body::-webkit-scrollbar-track {
    -webkit-box-shadow: inset 0 0 6px rgba(0,0,0,0.3);
}
 
body::-webkit-scrollbar-thumb {
  background-color: darkgrey;
  outline: 1px solid slategrey;
}

/* Стили для ссылки прокрутки */
.scroll-top-link {
    position: absolute;
    bottom: 20px; /* Отступ от нижнего края */
    left: 50%; /* Размещаем по центру сайдбара */
    transform: translateX(-50%); /* Смещаем кнопку назад на половину её ширины */
    background-color: #444;
    color: #fff;
    border-radius: 50%;
    width: 40px;
    height: 40px;
    display: flex;
    justify-content: center;
    align-items: center;
    text-decoration: none; /* Убираем подчёркивание */
    opacity: 0; /* Начально скрыта */
    visibility: hidden;
    transition: all 0.3s ease;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
}

.scroll-top-link.show {
    opacity: 1; /* Плавное появление */
    visibility: visible;
}

.scroll-top-link:hover {
    background-color: #555;
    transform: translateX(-50%) scale(1.1); /* Центрирование + увеличение при наведении */
}

.scroll-top-link i {
    font-size: 1.2rem;
}

<script>

 // Функция для фильтрации карточек
 $(document).ready(function() {
    $('#search').on('keyup', function() {
        var searchTerm = $(this).val().toLowerCase(); // Получаем значение из поля поиска и приводим к нижнему регистру
        $('.dashboard-main .card').each(function() {
            // Проверяем, если это card-1, пропускаем
            if ($(this).hasClass('card-1')) {
                return; // Пропускаем обработку
            }

            var itemText = $(this).text().toLowerCase(); // Получаем текст элемента и приводим к нижнему регистру
            if (itemText.indexOf(searchTerm) !== -1) {
                $(this).show(); // Если текст элемента содержит поисковый запрос, показываем элемент
            } else {
                $(this).hide(); // Иначе скрываем
            }
        });
    });
});



//функция для сортировки карточек
function sortCards() {
    const container = document.querySelector(".dashboard-main");
    const cards = Array.from(container.querySelectorAll(".card"));
    const excludedCard = container.querySelector(".card-1");
    const cardsToSort = cards.filter(card => card !== excludedCard);

    let dir = container.getAttribute("data-sort-dir") || "asc";

    const sortedCards = cardsToSort.sort((a, b) => {
        const titleA = a.querySelector(".title")?.textContent.trim().toLowerCase() || "";
        const titleB = b.querySelector(".title")?.textContent.trim().toLowerCase() || "";

        return dir === "asc" 
            ? titleA.localeCompare(titleB)
            : titleB.localeCompare(titleA);
    });

    container.innerHTML = "";
    
    if (excludedCard) {
        container.appendChild(excludedCard);
    }

    sortedCards.forEach(card => container.appendChild(card));
    container.setAttribute("data-sort-dir", dir === "asc" ? "desc" : "asc");
}

// Добавляем кнопки на сайдбаре(функционал)
document.querySelectorAll('.nav-item').forEach(button => {
    button.addEventListener('click', (e) => {
        e.preventDefault();
        const filter = button.getAttribute('data-filter');
        filterCards(filter);

        // Обновляем активный класс кнопок
        document.querySelectorAll('.nav-item').forEach(btn => {
            btn.classList.remove('active');
        });
        button.classList.add('active');
    });
});

// Функция для фильтрации карточек по категории
function filterCards(category) {
    const cards = document.querySelectorAll('.card');

    cards.forEach(card => {
        if (category === 'all' || card.getAttribute('data-category') === category) {
            card.style.display = 'grid'; // Показываем карточку
        } else {
            card.style.display = 'none'; // Скрываем карточку
        }
    });

    // Обновляем высоту сайдбара после фильтрации
    syncSidebarHeight();
}

// Проверяем, является ли устройство мобильным
function isMobileDevice() {
    return /Mobi|Android|iPhone|iPad|iPod|BlackBerry|Opera Mini|IEMobile|WPDesktop/i.test(navigator.userAgent);
}

if (!isMobileDevice()) {
    // курсор
    const coords = { x: 0, y: 0 };
    const circles = document.querySelectorAll(".circle");

    const colors = [
        "#ffb56b", "#fdaf69", "#f89d63", "#f59761", "#ef865e", "#ec805d",
        "#e36e5c", "#df685c", "#d5585c", "#d1525c", "#c5415d", "#c03b5d",
        "#b22c5e", "#ac265e", "#9c155f", "#950f5f", "#830060", "#7c0060",
        "#680060", "#60005f", "#48005f", "#3d005e"
    ];

    circles.forEach(function (circle, index) {
        circle.x = 0;
        circle.y = 0;
        circle.style.backgroundColor = colors[index % colors.length];
    });

    window.addEventListener("mousemove", function (e) {
        coords.x = e.clientX;
        coords.y = e.clientY;
    });

    function animateCircles() {
        let x = coords.x;
        let y = coords.y;

        circles.forEach(function (circle, index) {
            circle.style.left = x - 12 + "px";
            circle.style.top = y - 12 + "px";
            circle.style.scale = (circles.length - index) / circles.length;

            circle.x = x;
            circle.y = y;

            const nextCircle = circles[index + 1] || circles[0];
            x += (nextCircle.x - x) * 0.3;
            y += (nextCircle.y - y) * 0.3;
        });

        requestAnimationFrame(animateCircles);
    }

    animateCircles();
}



// Функция для синхронизации высоты сайдбара и кнопки
function syncSidebarHeight() {
    const main = document.querySelector('.dashboard-main');
    const sidebar = document.querySelector('.dashboard-sidebar');
    const scrollLink = document.querySelector('#scrollToTopLink');

    // Параметры для высоты
    const additionalHeight = 220; // Дополнительная высота для сайдбара
    const minSidebarHeight = 650; // Минимальная высота сайдбара
    const triggerHeight = 1800; // Высота страницы, при которой показывается кнопка

    // Рассчитываем высоту main и прибавляем дополнительный отступ
    const computedMainHeight = main.scrollHeight;
    const newSidebarHeight = Math.max(computedMainHeight + additionalHeight, minSidebarHeight);

    // Применяем высоту сайдбару
    sidebar.style.height = `${newSidebarHeight}px`;

    // Проверяем текущую высоту сайдбара и страницы
    if (newSidebarHeight >= triggerHeight) {
        scrollLink.classList.add('show'); // Показываем кнопку
    } else {
        scrollLink.classList.remove('show'); // Скрываем кнопку
    }
}

// Функция плавного скролла наверх
function scrollToTop() {
    window.scrollTo({
        top: 0,
        behavior: 'smooth'
    });
}

// Добавляем обработчики событий
document.addEventListener('DOMContentLoaded', () => {
    const scrollLink = document.querySelector('#scrollToTopLink');

    // Синхронизируем высоту при загрузке и изменении контента
    syncSidebarHeight();

    // Наблюдаем за изменениями внутри .dashboard-main
    const main = document.querySelector('.dashboard-main');
    const observer = new MutationObserver(syncSidebarHeight);
    observer.observe(main, { childList: true, subtree: true });

    // Обновляем высоту при изменении размера окна
    window.addEventListener('resize', syncSidebarHeight);

    // Обработчик клика для кнопки
    scrollLink.addEventListener('click', (e) => {
        e.preventDefault();
        scrollToTop();
    });
});
